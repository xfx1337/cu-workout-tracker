# Сборка, тесты и выкладка бота записи на тренировки.
#
# Порядок намеренно такой: СНАЧАЛА образ, ПОТОМ тесты внутри него.
# В закрытом контуре ЦУ интернет есть не у всех раннеров, а сборка образа
# нужна в любом случае — значит пусть она будет единственным местом, которому
# нужны pypi и apt. Тестам сеть уже не потребуется: всё лежит в образе.
#
# Переменные в Settings → CI/CD → Variables:
#   SSH_PRIVATE_KEY   (File, protected)  ключ для входа на сервер
#   SSH_KNOWN_HOSTS   (File, protected)  вывод `ssh-keyscan <сервер>`
#   DEPLOY_HOST       например deploy@10.0.0.5
#   DEPLOY_PATH       например /opt/cu-workout-tracker
#
# Необязательные:
#   PIP_INDEX_URL / PIP_TRUSTED_HOST   внутреннее зеркало pypi (pip читает их сам)
#   MM_URL / MM_TOKEN                  включают живые тесты против TiMe
#
# Секреты бота (MM_TOKEN для рантайма, пароль базы) в переменные CI не кладём:
# они живут в .env на сервере.

stages: [build, test, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE/bot
  TESTED: $CI_REGISTRY_IMAGE/bot:$CI_COMMIT_SHORT_SHA

# ---------------------------------------------------------------- сборка

сборка:образа:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$TESTED" .
    - docker push "$TESTED"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------- тесты
#
# Эти два набора не ходят в сеть вообще и обязаны проходить в любом окружении.
# Именно от них зависит выкладка.

.в-образе: &in_image
  stage: test
  image: $TESTED
  needs: ["сборка:образа"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

тесты:домен:
  <<: *in_image
  variables:
    DATABASE_URL: "sqlite+aiosqlite:////tmp/smoke.db"
  script:
    - python -m tests.smoke

тесты:диспетчер:
  <<: *in_image
  script:
    - python -m tests.test_dispatch

# Тот же набор на боевом движке. Требует раннера с поддержкой services,
# поэтому не блокирует выкладку: если раннер их не умеет, это его особенность,
# а не поломка кода.
тесты:postgres:
  <<: *in_image
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: workout
    POSTGRES_PASSWORD: workout
    POSTGRES_DB: workout_test
    SMOKE_DATABASE_URL: postgresql+asyncpg://workout:workout@postgres:5432/workout_test
  script:
    - python -m tests.smoke
  allow_failure: true

# Живые тесты против настоящего Mattermost. Включаются, только если в CI заданы
# MM_URL и MM_TOKEN. Если сервер недоступен или токен не принят, тесты сами
# сообщают о пропуске и завершаются успехом — падать они будут лишь на реальной
# ошибке в нашем коде. Выкладку всё равно не блокируют.
тесты:живые:
  <<: *in_image
  script:
    - python -m tests.mm_live
    - python -m tests.mm_buttons
  allow_failure: true
  rules:
    - if: $MM_URL && $MM_TOKEN

# ---------------------------------------------------------------- выкладка

выкладка:
  stage: deploy
  image: docker:27
  environment:
    name: production
  # Зависим только от тестов, которые обязаны проходить где угодно.
  # Postgres и живые тесты выкладку не блокируют — см. комментарии выше.
  needs: ["сборка:образа", "тесты:домен", "тесты:диспетчер"]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    # Ставим тег коммита, а не latest: видно, что развёрнуто, и есть куда откатиться.
    - |
      ssh "$DEPLOY_HOST" "
        set -e
        cd '$DEPLOY_PATH'
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'
        grep -q '^BOT_IMAGE=' .env \
          && sed -i 's|^BOT_IMAGE=.*|BOT_IMAGE=$TESTED|' .env \
          || echo 'BOT_IMAGE=$TESTED' >> .env
        docker compose pull bot
        docker compose up -d bot
        docker image prune -f
      "
    # Убеждаемся, что бот действительно поднялся, а не упал через две секунды
    - sleep 15
    - |
      ssh "$DEPLOY_HOST" "
        cd '$DEPLOY_PATH'
        docker compose ps bot
        docker compose logs bot --tail 30
        test \"\$(docker inspect -f '{{.State.Running}}' \$(docker compose ps -q bot))\" = true
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "mattermost"
      when: manual        # выкладка одной кнопкой в интерфейсе GitLab
      allow_failure: false
